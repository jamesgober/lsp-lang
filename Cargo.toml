# =============================================================================
#  R E P S   ·   lsp-lang
# =============================================================================
[package]
name    = "lsp-lang"
version = "2.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Language Server Protocol scaffolding on our own stack: server lifecycle, incremental document sync, diagnostics, and typed semantic tokens, symbols, hover, definition, and completion. No third-party dependencies."

# Keywords (5 max)
keywords = ["lsp", "language-server", "editor", "language", "tooling"]

# Categories
categories = ["development-tools", "text-editors"]

# Links
homepage      = "https://github.com/jamesgober/lsp-lang"
repository    = "https://github.com/jamesgober/lsp-lang"
documentation = "https://docs.rs/lsp-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lsp_lang"
path = "src/lib.rs"


# DEPENDENCIES
# #################################
[dependencies]
# The family's incremental reparser. Every open document is an
# `incremental_lang::Document`, so a keystroke reparses only the node around it.
# Its `Grammar` is how a language plugs in; re-exported so versions always match.
incremental-lang = { version = "1", default-features = false, features = ["std"] }
# The family's diagnostic type. `Context::publish_diagnostics` converts
# `diag_lang::Diagnostic` values to protocol diagnostics directly, so any stage
# built on diag-lang (lexer, parser, resolver, checker) publishes as-is. Only
# the type is used; the terminal renderer's colour support is left off.
diag-lang = { version = "1", default-features = false, features = ["std"] }
# JSON-RPC 2.0 over the base protocol's `Content-Length` framing: the decoder,
# the envelope, error codes, batches, id correlation for the server's own
# requests, and `$/cancelRequest`. The family's transport; its framing is
# exactly LSP's.
rpc-io = "0.2"
# The family's JSON: a borrowing parser with budgets, a pull reader, and a
# deterministic writer. Re-exported, since its `Value` is how a handler reads
# parameters and answers custom requests.
jsonx-lib = "0.2"


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# The examples resolve names with the family's symbol table and publish its
# diagnostics, showing that the integration needs no adapter.
symbol-lang = "1"
intern-lang = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
